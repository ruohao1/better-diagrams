name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - name: Check generated skill runtime
        run: |
          git diff --exit-code --stat -- skills/diagram-authoring/bin skills/diagram-authoring/licenses
          test -z "$(git ls-files --others --exclude-standard -- skills/diagram-authoring/bin skills/diagram-authoring/licenses)"
      - run: npm run test:unit
      - run: npm run test:browser
