  </defs>
  <rect class="node-body" width="240" height="100" rx="16" fill="url(#surface)" clip-path="url(#rounded)"/>
  <text class="node-label" x="18" y="42" data-field="label"/>
  <text x="18" y="74" font-size="12" fill="#52647a" data-field="data.status"/>
</svg>
